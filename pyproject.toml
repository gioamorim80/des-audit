[project]
name = "des-audit"
version = "1.0.0"
description = "Does a judgment model's reading of a chat tell you whom an offer moves? Estimates from your own randomized decision log."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
test = ["pytest>=8"]

[project.scripts]
des-audit = "des_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/des_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-local-folder = ["logs"]
